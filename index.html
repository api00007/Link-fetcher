<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Data Fetcher</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Consolas, "Courier New", monospace;
        }
        body {
            background-color: #121212;
            color: #d1d5db;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background-color: #181818;
            border: 1px solid #262626;
            border-radius: 4px;
            width: 100%;
            max-width: 580px;
            padding: 20px;
        }
        .title {
            text-align: center;
            font-size: 13px;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 11px;
            color: #cccccc;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 7px 10px;
            background-color: #202020;
            border: 1px solid #333333;
            border-radius: 2px;
            color: #ffffff;
            font-size: 12px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #0070f3;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0066ff;
            color: #ffffff;
            border: none;
            border-radius: 2px;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 4px;
        }
        button:hover {
            background-color: #0052cc;
        }
        button:disabled {
            background-color: #444444;
            cursor: not-allowed;
        }
        .status-line {
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            margin: 12px 0;
            min-height: 14px;
        }
        .status-success {
            color: #22c55e;
        }
        .status-fail {
            color: #eab308;
        }
        .output-box {
            background-color: #000000;
            border: 1px solid #262626;
            border-radius: 2px;
            padding: 12px;
            color: #38ef7d;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 380px;
            max-height: 480px;
            overflow-y: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">Raw Data Fetcher (No Format Change)</div>
    
    <div class="form-group">
        <label>Target URL:</label>
        <input type="text" id="targetUrl" placeholder="Enter Target URL">
    </div>

    <div class="form-group">
        <label>Referer Link:</label>
        <input type="text" id="refererLink" placeholder="Enter Referer">
    </div>

    <div class="form-group">
        <label>Method:</label>
        <select id="httpMethod">
            <option value="GET" selected>GET</option>
            <option value="POST">POST</option>
            <option value="HEAD">HEAD</option>
        </select>
    </div>

    <button id="fetchBtn" onclick="fetchData()">FETCH DATA</button>

    <div id="statusLine" class="status-line"></div>
    <div id="outputBox" class="output-box"></div>
</div>

<script>
    async function fetchData() {
        const url = document.getElementById('targetUrl').value.trim();
        const referer = document.getElementById('refererLink').value.trim();
        const method = document.getElementById('httpMethod').value;
        const fetchBtn = document.getElementById('fetchBtn');
        const statusLine = document.getElementById('statusLine');
        const outputBox = document.getElementById('outputBox');

        if (!url) {
            alert('Please enter a Target URL');
            return;
        }

        fetchBtn.disabled = true;
        fetchBtn.innerText = 'FETCHING...';
        statusLine.innerText = '';
        statusLine.className = 'status-line';
        outputBox.innerText = '';

        try {
            const response = await fetch('/api/fetch', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ url, referer, method })
            });

            const result = await response.json();

            if (result.statusCode >= 200 && result.statusCode < 300) {
                statusLine.className = 'status-line status-success';
                statusLine.innerText = `Success! HTTP Code: ${result.statusCode}`;
            } else {
                statusLine.className = 'status-line status-fail';
                statusLine.innerText = `Failed! HTTP Code: ${result.statusCode}`;
            }

            outputBox.innerText = result.data;
        } catch (err) {
            statusLine.className = 'status-line status-fail';
            statusLine.innerText = 'Failed! HTTP Code: 500';
            outputBox.innerText = err.message;
        } finally {
            fetchBtn.disabled = false;
            fetchBtn.innerText = 'FETCH DATA';
        }
    }
</script>

</body>
</html>
